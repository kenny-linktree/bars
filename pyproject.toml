[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bars-collector"
version = "0.1.0"
description = "Independent local usage collection for Bars"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
bars-collect = "bars_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["collector"]
